[package]
name = "simlink"
version = "0.1.0"
edition = "2021"
description = "평가기(Windows) ↔ WSL 통합 노드: 계획기 호스트(bagent link) + 시뮬레이터 관측 → scenemap(같은 프로세스 C ABI)"
publish = false
build = "build.rs"

[[bin]]
name = "simlink"
path = "src/main.rs"

[dependencies]
bagent = { package = "behavior-agent", path = "../../../agent/planner" }
serde_json = { version = "1", features = ["float_roundtrip"] }

# 가짜 scenemap(src/sim/integ/scenemap_stub/sm_stub.cpp)을 C++ 로 빌드. 진짜 libscenemap 은 SCENEMAP_LIB_DIR 로 링크(build.rs).
[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
