[package]
name = "sgview"
version = "0.1.0"
edition = "2021"
description = "2D viewer for the robot's object memory (scenemap: view.json + map.pgm, Spark-DSG scene.json next to them)"

[dependencies]
minifb = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
font8x8 = "0.3"

[profile.release]
opt-level = 3
