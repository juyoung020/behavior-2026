[package]
name = "simlink"
version = "0.1.0"
edition = "2021"
description = "평가기(Windows) ↔ WSL 통합 노드: 계획기 호스트(bagent link) + 시뮬레이터 관측 → meridian ROS 토픽"
publish = false

[[bin]]
name = "simlink"
path = "src/main.rs"

[dependencies]
bagent = { package = "behavior-agent", path = "../../agent" }
r2r = "0.9"
futures = "0.3"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
