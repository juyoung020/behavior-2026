[package]
name = "ftprep"
version = "0.2.0"
edition = "2021"
description = "Offline preparation for the native pi0.5 data loader: mp4 packet index, per-frame tables, LUT grid"

[dependencies]
parquet = "53"
arrow-array = "53"
arrow-schema = "53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentencepiece = "0.14"

[profile.release]
opt-level = 3
